[package]
name = "trackery-mobile"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Standalone: do NOT join the repo root workspace.
[workspace]

[lib]
name = "trackery_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: ships a working F12/right-click "Inspect" console in release
# builds too, not just dev — otherwise a shipped exe has no way to see what
# an import failure actually hit.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
trackery-core = { path = "../../../crates/trackery-core" }
